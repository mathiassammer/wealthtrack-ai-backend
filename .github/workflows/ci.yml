name: CI/CD Pipeline - WealthTrack AI

on:
  pull_request:
    branches: [ "main" ] # O robô acorda sempre que alguém tentar enviar código para a branch main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Executar a nossa esteira de qualidade (preCommit)
        run: ./gradlew preCommit --no-daemon