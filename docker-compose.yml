version: '3.8'

services:
  # Nosso banco de dados local (Staging/Dev)
  postgres-db:
    image: postgres:16-alpine
    container_name: wealthtrack_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password_local # Como é só local, não há risco. Em produção, é necessário usar o .env
      POSTGRES_DB: wealthtrack_db
    ports:
      - "5432:5432" # Expõe a porta 5432 do container para a porta 5432 da sua máquina
    volumes:
      - postgres_data:/var/lib/postgresql/data # Garante que os dados não sumam se o container for parado, reiniciado ou removido

  # RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wealthtrack_rabbitmq
    ports:
      - "5672:5672"   # Porta do sistema
      - "15672:15672" # Porta do Painel Visual Web (Você pode acessar no seu navegador!)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

  # KAFKA (Imagem Oficial da Apache Foundation)
  kafka:
    image: apache/kafka:3.7.0
    container_name: wealthtrack_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "wealthtrack-cluster-id-123"

  # N8N - Motor de Automação
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: wealthtrack_n8n
    ports:
      - "5678:5678" # Porta do painel visual (localhost:5678)
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: